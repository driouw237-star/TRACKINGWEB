    </div>

  <!-- 
    BYPASS SCRIPT: Injects an admin user and session before the app loads.
    Also force-unlocks the UI if admin.js tries to re-hide it.
  -->
  <script>
    // 1. Inject User
    (function() {
      var users = [];
      try { users = JSON.parse(localStorage.getItem('ge_users')) || []; } catch(e) {}
      
      if (!users.some(function(u) { return u.role === 'admin'; })) {
        users.push({
          id: 'admin_master',
          name: 'Super Admin',
          email: 'admin@globalexpress.test',
          role: 'admin',
          wallet: 0,
          joined: new Date().toISOString(),
          flags: {}
        });
        localStorage.setItem('ge_users', JSON.stringify(users));
      }

      // 2. Inject Session
      var session = { userId: 'admin_master', role: 'admin', token: 'bypass' };
      localStorage.setItem('ge_session', JSON.stringify(session));
      localStorage.setItem('ge_admin_session', JSON.stringify(session));
      localStorage.setItem('ge_current_user', JSON.stringify({ id: 'admin_master', role: 'admin' }));
    })();

    // 3. Force the DOM to stay unlocked after admin.js runs
    document.addEventListener('DOMContentLoaded', function() {
      setInterval(function() {
        var authWrap = document.getElementById('authWrap');
        if (authWrap) authWrap.style.display = 'none';
        
        var app = document.getElementById('app');
        if (app) {
          app.style.display = 'flex';
          app.classList.remove('hidden');
        }

        // If the router failed and content is empty, force-render Dashboard
        var content = document.getElementById('content');
        if (content && (content.innerHTML.trim() === '' || content.innerHTML.indexOf('Admin access required') !== -1)) {
          if (window.PagesAdmin && window.PagesAdmin.dashboard) {
            content.innerHTML = window.PagesAdmin.dashboard.render({});
            window.PagesAdmin.dashboard.bind({});
          }
        }
      }, 100);
    });
  </script>
